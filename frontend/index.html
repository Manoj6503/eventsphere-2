<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7c3aed;--i:#4f46e5;--b:#2563eb;--pk:#ec4899;--ink:#0f1b3d;--bg:#f5f3ff;--g:linear-gradient(135deg,#7c3aed 0%,#4f46e5 50%,#2563eb 100%);--g2:linear-gradient(135deg,#ec4899,#7c3aed)}
*{box-sizing:border-box}body{margin:0;font:16px Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 8% 0,#ede9fe,transparent 40%),radial-gradient(circle at 95% 25%,#fce7f3,transparent 35%),var(--bg)}
nav{display:flex;gap:8px;align-items:center;padding:12px 5%;background:#ffffffd9;backdrop-filter:blur(14px);box-shadow:0 2px 18px #6d28d924;position:sticky;top:0;z-index:5;flex-wrap:wrap}
#nav{display:flex;gap:8px;flex-wrap:wrap}.logo{font-weight:800;font-size:24px;background:var(--g2);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;cursor:pointer}
button,.btn{font:600 14px Inter,sans-serif;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--g);color:#fff;transition:.2s;box-shadow:0 4px 12px #4f46e533}
button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #7c3aed55}button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.o{background:#fff;color:var(--i);border:1.5px solid #c7d2fe;box-shadow:none}button.d{background:linear-gradient(135deg,#f43f5e,#be123c)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f472b6;outline-offset:2px}
#bc:not(:empty){background:var(--pk);color:#fff;border-radius:10px;padding:0 7px;margin-left:5px;font-size:12px}
.hero{background:var(--g);background-size:200% 200%;animation:flow 12s ease infinite;color:#fff;text-align:center;padding:72px 5% 48px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(45px);opacity:.5}
.hero:before{width:300px;height:300px;background:#ec4899;top:-90px;left:-70px}.hero:after{width:340px;height:340px;background:#38bdf8;bottom:-130px;right:-80px}
.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(32px,6.5vw,58px);margin:0 0 12px;font-weight:800;letter-spacing:-1px}.hero p{opacity:.95;max-width:620px;margin:0 auto 24px;font-size:18px}
.hero input{width:min(540px,92%);padding:15px 22px;border-radius:40px;border:0;font-size:16px;box-shadow:0 10px 30px #0003}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.chip{background:#ffffff30;color:#fff;border:1px solid #ffffff80;box-shadow:none;padding:7px 16px}.chip.on{background:#fff;color:var(--i)}
.hstats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px}.hstats div{background:#ffffff26;border:1px solid #ffffff55;backdrop-filter:blur(8px);border-radius:16px;padding:10px 22px;min-width:120px}.hstats b{display:block;font-size:26px}.hstats span{font-size:13px;opacity:.9}
@keyframes flow{50%{background-position:100% 50%}}
main{padding:28px 5%;max-width:1200px;margin:auto}h2{margin:8px 0 18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:22px}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 6px 22px #4f46e522;transition:.25s;border:1px solid #ede9fe}.card:hover{transform:translateY(-6px);box-shadow:0 16px 36px #7c3aed38}
.ban{height:150px;background:var(--g) center/cover;position:relative}.em{position:absolute;inset:0;display:grid;place-items:center;font-size:58px;font-style:normal;filter:drop-shadow(0 6px 10px #0003)}
.date{position:absolute;top:12px;left:12px;background:#fff;border-radius:12px;padding:5px 11px;font-weight:800;font-size:13px;color:var(--p);z-index:1}
.cb{padding:16px 18px}.cb h3{margin:8px 0}.tag{background:linear-gradient(135deg,#fce7f3,#ede9fe);color:#9d174d;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700}.meta{font-size:14px;color:#475569;margin:5px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
form.box,.panel{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #4f46e51f;max-width:700px;margin:auto;border:1px solid #ede9fe}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid #ddd6fe;border-radius:12px;font:inherit;background:#faf9ff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #4f46e51a;display:block;overflow-x:auto}th,td{padding:11px;text-align:left;border-bottom:1px solid #ede9fe;font-size:14px}th{background:linear-gradient(135deg,#ede9fe,#e0e7ff);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}.stat{background:#fff;border-radius:18px;padding:18px;text-align:center;border-top:4px solid var(--pk);box-shadow:0 4px 18px #4f46e51a;text-transform:capitalize}.stat b{display:block;font-size:30px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:11px;border-radius:6px;background:var(--g2)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90vw}#toast.on{opacity:1}#toast.err{background:#be123c}
.empty{text-align:center;padding:40px;color:#64748b}.sk{height:270px;border-radius:22px;background:linear-gradient(90deg,#ede9fe,#f5f3ff,#ede9fe);background-size:200%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200%}}
footer{text-align:center;padding:30px;color:#64748b;font-size:14px}footer a{color:var(--i)}.st{font-weight:700;text-transform:capitalize;color:var(--p)}
@media(max-width:600px){.two{grid-template-columns:1fr}.hero{padding-top:48px}}
</style></head><body>
<nav><span class="logo" onclick="go('home')" tabindex="0">&#127914; EventSphere</span><span id="nav"></span></nav>
<div id="app"></div>
<footer>EventSphere &middot; About &middot; Contact &middot; Help &middot; Privacy &middot; <a href="#" onclick="verify();return false">Verify certificate</a></footer><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Technical','Workshop','Seminar','Cultural','Sports','Hackathon','Other'];let me=null,cat='',q='';
function toast(m,e){const t=$('#toast');t.textContent=m;t.className='on'+(e?' err':'');setTimeout(()=>t.className='',3000)}
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function init(){me=(await api('/me')).user;nav();if(!await handleIn())go('home')}
function nav(){nav0();poll()}
function nav0(){const r=me?.role;$('#nav').innerHTML=me?`<button class=o onclick="go('home')">Events</button><button class=o id=bell onclick="bell()" aria-label=Notifications>&#128276;<b id=bc></b></button> ${r=='student'?`<button class=o onclick="go('mine')">My Registrations</button>`:''} ${r=='organizer'?`<button class=o onclick="go('myev')">My Events</button><button class=o onclick="go('form')">Create Event</button><button class=o onclick="go('scan')">Scan Attendance</button>`:''} ${r=='admin'?`<button class=o onclick="go('admin')">Admin</button><button class=o onclick="go('scan')">Scan Attendance</button>`:''} <button onclick="out()">Logout (${esc(me.name)})</button>`:`<button class=o onclick="go('login')">Login</button><button onclick="go('signup')">Sign up</button>`}
async function out(){await api('/logout','POST');me=null;nav();go('home')}
function go(v,x){cur=v;stopScan();clearInterval(qt);({home,login,signup,mine,myev,form,admin,scan}[v])(x)}
const card=(e,mode)=>{const left=e.capacity-e.taken;return `<div class=card><div class=ban style="${e.banner?`background-image:url('${esc(e.banner).replace(/'/g,'')}')`:`background:linear-gradient(135deg,${(CC[e.category]||CC.Other)[0]},${(CC[e.category]||CC.Other)[1]})`}"><span class=date>${esc(e.event_date)}</span>${e.banner?'':`<i class=em>${(CC[e.category]||CC.Other)[2]}</i>`}</div><div class=cb><span class=tag>${esc(e.category)}</span><h3>${esc(e.title)}</h3><div class=meta>&#128205; ${esc(e.venue)} &middot; ${esc(e.start_time||'')}</div><div class=meta>by ${esc(e.organizer)} &middot; ${left>0?left+' of '+e.capacity+' seats left':'Full'}</div><div class=meta>${esc(e.description).slice(0,90)}</div><div class=row>${mode=='pub'?`<button ${left<1?'disabled':''} onclick="reg(${e.id})">${left<1?'Full':'Register'}</button>`:`<span class=st>${e.status.replace('_',' ')}</span><button class=o onclick='form(${JSON.stringify(e).replace(/'/g,"&#39;")})'>Edit</button>`}</div></div></div>`};
async function home(){$('#app').innerHTML=`<div class=hero><h1>Discover. Participate. Achieve.</h1><p>Your campus events, registrations, attendance, and certificates &mdash; all in one place.</p><input id=s aria-label="Search events" placeholder="Search events..." value="${esc(q)}"><div class=chips>${['',...CATS].map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';home()">${c||'All'}</button>`).join('')}</div><div class=hstats id=hs></div></div><main><h2>Upcoming events</h2><div class=grid id=ev>${'<div class=sk></div>'.repeat(3)}</div></main>`;
 $('#s').oninput=e=>{q=e.target.value;clearTimeout(window.t);window.t=setTimeout(load,300)};load();loadStats()}
async function load(){const r=await api(`/events?q=${encodeURIComponent(q)}&category=${encodeURIComponent(cat)}`);$('#ev').innerHTML=r.events.map(e=>card(e,'pub')).join('')||'<div class=empty>No events found. Try another search.</div>'}
async function reg(id){if(!me)return go('login');try{const r=await api(`/events/${id}/register`,'POST');toast('Registered! ID '+r.reg_code);load()}catch(e){toast(e.message,1)}}
function authForm(t){$('#app').innerHTML=`<main><form class=box id=f><h2>${t=='login'?'Welcome back':'Create account'}</h2>${t=='signup'?'<label>Full name<input name=name required></label>':''}<label>Email<input name=email type=email required></label><label>Password (8+ chars)<input name=password type=password minlength=8 required></label>${t=='signup'?'<label>I am a<select name=role><option value=student>Student</option><option value=organizer>Event Organizer</option></select></label>':''}<br><button>${t=='login'?'Login':'Sign up'}</button></form></main>`;
 $('#f').onsubmit=async ev=>{ev.preventDefault();const b=Object.fromEntries(new FormData(ev.target));try{if(t=='signup'){await api('/signup','POST',b);toast('Account created, please log in');return login()}await api('/login','POST',b);me=(await api('/me')).user;nav();if(!await handleIn())home()}catch(e){toast(e.message,1)}}}
const login=()=>authForm('login'),signup=()=>authForm('signup');
async function mine(){try{const r=(await api('/my/registrations')).registrations;window.R=r;$('#app').innerHTML=`<main><h2>My registrations</h2>${r.length?`<table><tr><th>ID<th>Event<th>Date<th>Status<th>Attendance<th>QR / Certificate</tr>${r.map((x,i)=>`<tr><td>${esc(x.reg_code)}<td>${esc(x.title)}<td>${esc(x.event_date)}<td class=st>${x.status}<td>${x.checked_in_at?'&#9989; Present':'-'}<td>${x.cert_id?`<a class=btn style="text-decoration:none;display:inline-block" href="/api/certificates/${x.cert_id}/download">Download certificate</a> <small>email: ${esc(x.email_status)}</small>`:x.status!='confirmed'?'':x.is_today?`<button onclick="qr(${i})">Show QR pass</button>`:`<small>QR opens on ${esc(x.event_date)}</small> <button class=d onclick="cancel(${x.id})">Cancel</button>`}</tr>`).join('')}</table>`:'<div class=empty>You have not registered for any events yet.</div>'}<div id=qrbox></div></main>`}catch(e){toast(e.message,1)}}
function qr(i){const x=R[i];$('#qrbox').innerHTML=`<div class=panel style="text-align:center;margin-top:20px"><h3>${esc(x.title)}</h3><div id=qrc style="display:inline-block;padding:12px;background:#fff"></div><p><b>${esc(x.reg_code)}</b><br>Show this QR to the organizer at entry</p></div>`;new QRCode($('#qrc'),{text:x.qr_token,width:220,height:220});$('#qrbox').scrollIntoView()}
async function cancel(id){if(!confirm('Cancel this registration?'))return;try{await api(`/registrations/${id}/cancel`,'POST');toast('Cancelled');mine()}catch(e){toast(e.message,1)}}
async function myev(){const r=(await api('/my/events')).events;$('#app').innerHTML=`<main><h2>My events</h2><div class=grid>${r.map(e=>card(e,'own')).join('')||'<div class=empty>No proposals yet.</div>'}</div></main>`}
function form(e){e=e||{};const f=(n,l,t='text',r=1)=>`<label>${l}<input name=${n} type=${t} value="${esc(e[n])}" ${r?'required':''}></label>`;
 $('#app').innerHTML=`<main><form class=box id=f><h2>${e.id?'Edit event':'Propose an event'}</h2>${f('title','Title')}<label>Description<textarea name=description rows=3>${esc(e.description)}</textarea></label><div class=two><label>Category<select name=category>${CATS.map(c=>`<option ${c==e.category?'selected':''}>${c}</option>`).join('')}</select></label>${f('capacity','Capacity','number')}</div>${f('banner','Banner image URL','url',0)}${f('venue','Venue')}<div class=two>${f('event_date','Event date','date')}${f('start_time','Start','time',0)}${f('end_time','End','time',0)}${f('reg_open','Registration opens','date')}${f('reg_close','Registration closes','date')}</div>${f('eligibility','Eligibility','text',0)}${f('contact','Contact details','text',0)}<br><button>Submit for approval</button></form></main>`;
 $('#f').onsubmit=async ev=>{ev.preventDefault();try{const r=await api(e.id?`/events/${e.id}/update`:'/events','POST',Object.fromEntries(new FormData(ev.target)));toast(r.message);myev()}catch(x){toast(x.message,1)}}}
async function admin(){try{const[s,l]=await Promise.all([api('/admin/stats'),api('/admin/events')]);const t=s.stats,mx=Math.max(1,...s.byCategory.map(c=>c.n));
 $('#app').innerHTML=`<main><h2>Admin dashboard</h2><div class=stats>${Object.entries(t).map(([k,v])=>`<div class=stat><b>${v}</b>${k}</div>`).join('')}</div><div class=panel style="max-width:none;margin-bottom:20px"><b>Registrations by category</b>${s.byCategory.map(c=>`<div class=meta>${esc(c.category)} (${c.n})<div class=bar style="width:${c.n/mx*100}%;min-width:4px"></div></div>`).join('')}</div><table><tr><th>Event<th>Organizer<th>Date<th>Seats<th>Status<th>Review</tr>${l.events.map(e=>`<tr><td>${esc(e.title)}<td>${esc(e.organizer)}<td>${esc(e.event_date)}<td>${e.taken}/${e.capacity}<td class=st>${e.status.replace('_',' ')}<td><button onclick="rev(${e.id},'approve')">Approve</button> <button class=o onclick="rev(${e.id},'changes')">Changes</button> <button class=d onclick="rev(${e.id},'reject')">Reject</button></tr>`).join('')}</table></main>`}catch(e){toast(e.message,1)}}
async function rev(id,action){let reason='';if(action!='approve'){reason=prompt('Reason (required):');if(!reason)return}try{toast((await api(`/admin/events/${id}/review`,'POST',{action,reason})).message);admin()}catch(e){toast(e.message,1)}}
let sc=null,busy=false;
function stopScan(){if(sc){const s=sc;sc=null;return s.stop().catch(()=>{})}return Promise.resolve()}
async function scan(){try{const ev=(await api(me.role=='admin'?'/admin/events':'/my/events')).events.filter(e=>e.status=='published');
 $('#app').innerHTML=`<main><h2>Attendance</h2>${ev.length?`<div class=panel style="max-width:none;text-align:center"><label style="text-align:left">Event<select id=se>${ev.map(e=>`<option value=${e.id}>${esc(e.title)} (${esc(e.event_date)})</option>`).join('')}</select></label><div id=rd style="margin:14px auto"></div><button onclick="evQR()">Show attendance QR</button> <button class=o onclick="startScan()">Scan student passes with camera</button><div id=res class=empty></div><div class=two><input id=mc placeholder="Or type registration ID (REG-...)"><button onclick="check($('#mc').value)">Check in</button></div></div><h2>Participants</h2><div id=pl></div>`:'<div class=empty>No published events yet. Events appear here after the admin approves them.</div>'}</main>`;
 if(ev.length){$('#se').onchange=()=>{plist();evQR()};plist();evQR()}}catch(e){toast(e.message,1)}}
async function startScan(){if(!window.Html5Qrcode)return toast('Scanner library not loaded (check internet)',1);clearInterval(qt);await stopScan();$('#rd').innerHTML='';sc=new Html5Qrcode('rd');
 try{await sc.start({facingMode:'environment'},{fps:10,qrbox:240},t=>{if(busy)return;busy=true;check(t).finally(()=>setTimeout(()=>busy=false,2000))})}catch(e){sc=null;toast('Camera blocked, or the page is not HTTPS: '+e,1)}}
async function check(t){const r=$('#res');try{const j=await api('/attendance/check','POST',{event_id:+$('#se').value,token:t.trim()});
 r.className='';r.style.cssText='padding:16px;border-radius:12px;font-weight:700;background:'+(j.result=='ok'?'#dcfce7;color:#166534':'#fef9c3;color:#854d0e');
 r.textContent=(j.result=='ok'?'\u2705 Checked in: ':'\u26a0\ufe0f Already checked in: ')+j.name+' ('+j.reg_code+')'+(j.certificate?' \u2014 certificate issued':'');plist()}catch(e){r.className='';r.style.cssText='padding:16px;border-radius:12px;font-weight:700;background:#ffe4e6;color:#9f1239';r.textContent='\u274c '+e.message}}
async function plist(){try{const p=(await api(`/events/${$('#se').value}/participants`)).participants;window.P=p;const n=p.filter(x=>x.checked_in_at).length;
 $('#pl').innerHTML=p.length?`<p>${p.filter(x=>x.status=='confirmed').length} registered &middot; ${n} present <button class=o onclick="csv()">Export CSV</button></p><table><tr><th>Name<th>Reg ID<th>Status<th>Attendance<th>Certificate</tr>${p.map(x=>`<tr><td>${esc(x.name)}<td>${esc(x.reg_code)}<td class=st>${x.status}<td>${x.checked_in_at?'Present '+esc(x.checked_in_at):'-'}<td>${x.cert_id?esc(x.cert_id)+' ('+esc(x.email_status)+')'+(x.email_status!='sent'?` <button class=o onclick="resend('${x.cert_id}')">Retry email</button>`:''):'-'}</tr>`).join('')}</table>`:'<div class=empty>No registrations yet.</div>'}catch(e){toast(e.message,1)}}
function csv(){const rows=[['Name','Email','RegID','Status','CheckedIn'],...P.map(x=>[x.name,x.email,x.reg_code,x.status,x.checked_in_at||''])];const b=new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='attendance.csv';a.click()}
const CC={Technical:['#2563eb','#7c3aed','\u{1F4BB}'],Workshop:['#0ea5e9','#6366f1','\u{1F6E0}\uFE0F'],Seminar:['#6366f1','#a855f7','\u{1F3A4}'],Cultural:['#ec4899','#f59e0b','\u{1F3AD}'],Sports:['#10b981','#2563eb','\u26BD'],Hackathon:['#7c3aed','#ec4899','\u{1F680}'],Other:['#4f46e5','#06b6d4','\u2728']};
async function loadStats(){try{const s=(await api('/public/stats')).stats;$('#hs').innerHTML=`<div><b>${s.events}</b><span>Live events</span></div><div><b>${s.registrations}</b><span>Registrations</span></div><div><b>${s.certificates}</b><span>Certificates issued</span></div>`}catch(e){}}
let qt=null,cur='home';
async function evQR(){const id=$('#se').value;clearInterval(qt);await stopScan();let tick=0;
 async function draw(){try{const j=await api(`/events/${id}/checkin-qr`);const w=j.is_today?'':`<p style="color:#be123c;font-weight:700">Attendance counts only on the event date (${esc(j.event_date)}).</p>`;
  $('#rd').innerHTML=`<h3>${esc(j.title)}</h3><div id=qrc2 style="display:inline-block;padding:16px;background:#fff;border-radius:16px;box-shadow:0 6px 20px #4f46e533"></div><p><b>Students:</b> scan this QR with your phone camera and log in. Attendance and your certificate are issued instantly.</p>${w}`;new QRCode($('#qrc2'),{text:location.origin+'/#in='+id+'.'+j.token,width:280,height:280})}catch(e){clearInterval(qt);$('#rd').innerHTML='<div class=empty>'+esc(e.message)+'</div>'}}
 await draw();qt=setInterval(()=>{if(!$('#se')){clearInterval(qt);return}plist();if(++tick%6==0)draw()},10000)}
async function handleIn(){const m=location.hash.match(/^#in=(\d+)\.([0-9a-f]+)/);if(!m)return false;if(!me){toast('Please log in to mark your attendance');go('login');return true}
 history.replaceState(null,'',location.pathname);
 try{const j=await api('/attendance/self','POST',{event_id:+m[1],token:m[2]});$('#app').innerHTML=`<main><div class=panel style="text-align:center"><h2>${j.result=='ok'?'\u2705 Attendance marked':'\u26a0\ufe0f Already marked'}</h2><p>${esc(j.name)} (${esc(j.reg_code)})</p>${j.certificate?`<p>Your certificate is ready.</p><a class=btn style="text-decoration:none;display:inline-block" href="/api/certificates/${j.certificate}/download">Download certificate</a> `:''}<button class=o onclick="go('mine')">My registrations</button></div></main>`}
 catch(e){$('#app').innerHTML=`<main><div class=panel style="text-align:center"><h2>\u274c ${esc(e.message)}</h2><button onclick="go('home')">Home</button></div></main>`}return true}
let lastN=null,notes=[];
async function poll(){if(!me)return;try{const r=await api('/notifications');notes=r.notifications;const u=r.unread,b=$('#bc');if(lastN!==null&&u>lastN&&cur=='mine')mine();if(b)b.textContent=u?u:'';if(lastN!==null&&u>lastN&&window.Notification&&Notification.permission=='granted'&&notes[0])new Notification('EventSphere',{body:notes[0].message});lastN=u}catch(e){}}
function bell(){let p=$('#np');if(p){p.remove();return}if(window.Notification&&Notification.permission=='default')Notification.requestPermission();p=document.createElement('div');p.id='np';p.style.cssText='position:fixed;top:60px;right:10px;width:min(360px,94vw);max-height:70vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 10px 30px #0004;z-index:8;padding:10px';
 p.innerHTML='<b>Notifications</b>'+(notes.map(n=>`<div class=meta style="border-bottom:1px solid #ede9fe;padding:8px 0;${n.is_read?'':'font-weight:700'}">${esc(n.message)}<br><small>${esc(n.created_at)}</small></div>`).join('')||'<div class=empty>No notifications</div>');document.body.appendChild(p);api('/notifications/read','POST').then(()=>{lastN=0;const b=$('#bc');if(b)b.textContent=''})}
async function resend(id){try{toast((await api(`/certificates/${id}/resend`,'POST')).message);setTimeout(plist,3000)}catch(e){toast(e.message,1)}}
function verify(){$('#app').innerHTML=`<main><form class=box id=f><h2>Verify a certificate</h2><label>Certificate ID<input name=id placeholder="CERT-XXXXXXXXXX" required></label><br><button>Verify</button><div id=vr class=meta style="margin-top:14px"></div></form></main>`;$('#f').onsubmit=async ev=>{ev.preventDefault();try{const j=await api('/certificates/verify/'+encodeURIComponent(new FormData(ev.target).get('id').trim()));$('#vr').innerHTML=`&#9989; <b>Valid certificate</b><br>${esc(j.name)} attended <b>${esc(j.event)}</b> on ${esc(j.date)}<br>Issued ${esc(j.issued)}`}catch(e){$('#vr').textContent='\u274c '+e.message}}}
